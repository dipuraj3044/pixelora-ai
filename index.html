<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixelora AI - Photo Enhancer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#171717;
  min-height:100vh;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:22px 15px;
}

header h1{
  font-size:28px;
  margin-bottom:6px;
}

header p{
  color:#cbd5e1;
  font-size:14px;
}

.container{
  max-width:650px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
  text-align:center;
}

.card h2{
  font-size:22px;
  margin-bottom:8px;
}

.card p{
  color:#64748b;
  margin-bottom:22px;
}

.upload-box{
  display:block;
  border:2px dashed #94a3b8;
  border-radius:16px;
  padding:35px 15px;
  cursor:pointer;
  background:#f8fafc;
}

.upload-box:hover{
  border-color:#111827;
}

.upload-icon{
  font-size:45px;
  margin-bottom:12px;
}

.upload-text{
  font-size:16px;
  font-weight:bold;
}

.upload-small{
  font-size:13px;
  color:#64748b;
  margin-top:6px;
}

#photoInput{
  display:none;
}

#preview{
  max-width:100%;
  max-height:400px;
  margin-top:20px;
  border-radius:12px;
  display:none;
}

.enhance-btn{
  display:none;
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.enhance-btn:active{
  transform:scale(.98);
}

#result{
  display:none;
  margin-top:25px;
}

#result h3{
  margin-bottom:12px;
}

#resultImage{
  max-width:100%;
  border-radius:12px;
}

.download-btn{
  display:inline-block;
  margin-top:15px;
  padding:13px 22px;
  border-radius:10px;
  background:#16a34a;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#64748b;
  font-size:13px;
}

footer a{
  color:#475569;
  text-decoration:none;
  margin:0 6px;
}
</style>
</head>

<body>

<header>
  <h1>✨ Pixelora AI</h1>
  <p>Make your photos cleaner, sharper and better</p>
</header>

<div class="container">

  <div class="card">

    <h2>AI Photo Enhancer</h2>
    <p>Upload your photo and enhance it instantly.</p>

    <label class="upload-box" for="photoInput">

      <div class="upload-icon">📸</div>

      <div class="upload-text">
        Choose Photo
      </div>

      <div class="upload-small">
        JPG, JPEG or PNG
      </div>

    </label>

    <input type="file" id="photoInput" accept="image/*">

    <img id="preview" alt="Photo Preview">

    <button class="enhance-btn" id="enhanceBtn">
      ✨ Enhance Photo
    </button>

    <div id="result">

      <h3>Enhanced Photo</h3>

      <img id="resultImage" alt="Enhanced Photo">

      <br>

      <a id="downloadBtn"
         class="download-btn"
         download="pixelora-enhanced.jpg">
         ⬇️ Download Photo
      </a>

    </div>

  </div>

</div>

<footer>
  © 2026 Pixelora AI
  <br><br>
  <a href="#">Privacy Policy</a>
  <a href="#">Terms</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</footer>

<script>

const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");
const enhanceBtn = document.getElementById("enhanceBtn");
const result = document.getElementById("result");
const resultImage = document.getElementById("resultImage");
const downloadBtn = document.getElementById("downloadBtn");

let selectedImage = null;

photoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("Please select an image.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    preview.src = e.target.result;
    preview.style.display = "block";

    enhanceBtn.style.display = "block";

    result.style.display = "none";

    selectedImage = e.target.result;
  };

  reader.readAsDataURL(file);

});

enhanceBtn.addEventListener("click", function(){

  if(!selectedImage){
    alert("Please select a photo first.");
    return;
  }

  enhanceBtn.innerText = "✨ Enhancing...";
  enhanceBtn.disabled = true;

  const img = new Image();

  img.onload = function(){

    const canvas = document.createElement("canvas");

    const scale = 2;

    canvas.width = img.width * scale;
    canvas.height = img.height * scale;

    const ctx = canvas.getContext("2d");

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(
      img,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const enhancedImage = canvas.toDataURL(
      "image/jpeg",
      0.95
    );

    resultImage.src = enhancedImage;

    downloadBtn.href = enhancedImage;

    result.style.display = "block";

    enhanceBtn.innerText = "✨ Enhance Photo";
    enhanceBtn.disabled = false;

    result.scrollIntoView({
      behavior:"smooth"
    });

  };

  img.src = selectedImage;

});

</script>

</body>
</html>
